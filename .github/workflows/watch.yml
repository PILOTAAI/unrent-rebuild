name: watch
# Finds Unrent agent releases this repository has not countersigned yet and starts rebuild.yml for each, at a tag of
# the same name in THIS repository (its certificate then names refs/tags/agent-v<version>). A release qualifies once
# PILOTAAI/unrent has the tag and get.unrent.dev publishes it (with the release workflow's signature, sigstore 1-of-2).
# NV-37: only the release tagger GitHub App can create agent-v* tags here (PILOTAAI/unrent infra/github/release-tags.tf;
# no person, deploy key or GITHUB_TOKEN can), so the `tag` job creates each new tag on this commit of main with that
# App's token (Contents: write on this repository only, the tag step alone), and the tag's push starts rebuild.yml at
# it (a GitHub App's push starts workflows). The `watch` job decides, holding no write access to contents.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: watch
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write           # dispatch rebuild.yml at an existing tag
    outputs:
      tags: ${{ steps.start.outputs.tags }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: PILOTAAI/unrent
          ssh-key: ${{ secrets.UNRENT_SOURCE_DEPLOY_KEY }}
          path: src
          fetch-depth: 1
          # The tags come with the checkout, while the deploy key is there: with persist-credentials off, a later
          # `git fetch` has no key (every run failed "Permission denied (publickey)" until 2026-11-18).
          fetch-tags: true
          persist-credentials: false
      - name: Start rebuilds
        id: start
        run: |
          new=()
          for tag in $(git -C src tag -l 'agent-v*' --sort=-v:refname | head -10); do
            v=${tag#agent-v}
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then continue; fi
            s=$(curl -fsS "https://get.unrent.dev/releases/$v/manifest.json" | jq -r .sigstore 2>/dev/null || echo unpublished)
            [ "$s" = 1-of-2 ] || { echo "$tag: get.unrent.dev has '$s'; nothing to do"; continue; }
            if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
              # The tag can never move or be deleted (infra/github/rebuild.tf), so it is created only once a dry run
              # (rebuild-check.yml) passed for this version at this very commit of main; a failed dry run is reported
              # and not retried until main changes (a person can dispatch it again).
              runs=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow rebuild-check.yml --branch main --limit 50 \
                --json displayTitle,headSha,status,conclusion \
                --jq "[.[] | select(.displayTitle == \"rebuild-check $v\" and .headSha == \"$GITHUB_SHA\")]")
              if [ "$(jq '[.[] | select(.conclusion == "success")] | length' <<<"$runs")" = 0 ]; then
                if [ "$(jq 'length' <<<"$runs")" = 0 ]; then
                  gh workflow run rebuild-check.yml --repo "$GITHUB_REPOSITORY" --ref main -f version="$v"
                  echo "$tag: dry run started"
                elif [ "$(jq '[.[] | select(.status != "completed")] | length' <<<"$runs")" != 0 ]; then
                  echo "$tag: dry run in progress"
                else
                  echo "::warning::$tag: the dry run failed at this commit; no tag is created (fix release-rebuild/ and sync)"
                fi
                continue
              fi
              # The dry run passed here: the tag job creates the tag on this commit, and its push starts rebuild.yml.
              new+=("$tag")
              echo "$tag: dry run passed at $GITHUB_SHA; tagging"
              continue
            fi
            # One run per tag (a run already in progress or queued is left alone). A tag runs the workflow at that tag,
            # which never changes: after 3 failed runs the failure is not transient (agent-v0.4.1), so it is reported
            # and no longer retried; a person can still dispatch rebuild.yml at the tag.
            runs=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow rebuild.yml --branch "$tag" --limit 50 --json status,conclusion)
            if [ "$(jq '[.[] | select(.status != "completed")] | length' <<<"$runs")" != 0 ]; then
              echo "$tag: rebuild in progress"
            elif [ "$(jq '[.[] | select(.conclusion == "failure")] | length' <<<"$runs")" -ge 3 ]; then
              echo "::warning::$tag: rebuild.yml failed 3 times at this tag; not retried (the tag cannot move; the next release is countersigned)"
            else
              gh workflow run rebuild.yml --repo "$GITHUB_REPOSITORY" --ref "$tag"
              echo "$tag: rebuild started"
            fi
          done
          echo "tags=${new[*]}" >> "$GITHUB_OUTPUT"

  tag:
    needs: watch
    if: needs.watch.outputs.tags != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: release-tagging   # main only; holds RELEASE_TAGGER_APP_ID and RELEASE_TAGGER_APP_KEY (owner step)
    permissions:
      contents: read
    steps:
      - name: The release tagger App exists (owner step, PILOTAAI/unrent docs/release-signing.md "Release tags")
        env:
          HAVE_APP: ${{ secrets.RELEASE_TAGGER_APP_ID != '' && secrets.RELEASE_TAGGER_APP_KEY != '' }}
        run: |
          [ "$HAVE_APP" = true ] || { echo "::error::Add the release tagger GitHub App's RELEASE_TAGGER_APP_ID and RELEASE_TAGGER_APP_KEY to this repository's release-tagging environment: only that App can create agent-v* tags."; exit 1; }
      # NV-37 owner step: pin by full commit SHA, as in PILOTAAI/unrent's agent-release.yml (fail closed until then).
      - name: Release tagger App token (PILOTAAI/unrent-rebuild, Contents write; for the tag step only)
        id: app
        uses: actions/create-github-app-token@OWNER-MUST-PIN-THIS-TO-A-FULL-COMMIT-SHA
        with:
          app-id: ${{ secrets.RELEASE_TAGGER_APP_ID }}
          private-key: ${{ secrets.RELEASE_TAGGER_APP_KEY }}
          owner: PILOTAAI
          repositories: unrent-rebuild
          permission-contents: write
      - name: Tag main as each release (its push runs rebuild.yml at the tag)
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          TAGS: ${{ needs.watch.outputs.tags }}
        run: |
          for tag in $TAGS; do
            [[ $tag =~ ^(agent-v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?)$ ]] || { echo "::error::bad tag '$tag'"; exit 1; }
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then echo "$tag exists; the watch handles it"; continue; fi
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA" >/dev/null
            echo "$tag: tagged $GITHUB_SHA; its push runs rebuild.yml at the tag"
          done
